<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Academic Book / Companion Logo -->
  <g transform="translate(96, 120)" filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M 160 50 C 110 30 40 35 10 50 L 10 230 C 40 215 110 210 160 230 Z" fill="#ffffff" />
    <!-- Book Right Page -->
    <path d="M 160 50 C 210 30 280 35 310 50 L 310 230 C 280 215 210 210 160 230 Z" fill="#f8fafc" />
    <!-- Book Spine center -->
    <path d="M 158 50 L 162 50 L 162 232 L 158 232 Z" fill="#cbd5e1" />
    <!-- Lines on left page -->
    <path d="M 35 90 C 70 80 110 80 135 90" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 35 125 C 70 115 110 115 135 125" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 35 160 C 70 150 110 150 135 160" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Lines on right page -->
    <path d="M 185 90 C 210 80 250 80 285 90" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 185 125 C 210 115 250 115 285 125" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 185 160 C 210 150 250 150 285 160" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- AI Sparkle Top Right -->
  <g transform="translate(340, 70)">
    <path d="M 40 0 Q 40 40 0 40 Q 40 40 40 80 Q 40 40 80 40 Q 40 40 40 0 Z" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="70" cy="15" r="6" fill="#fde047" />
  </g>

  <!-- Sparkle Bottom Left -->
  <g transform="translate(60, 360)">
    <path d="M 25 0 Q 25 25 0 25 Q 25 25 25 50 Q 25 25 50 25 Q 25 25 25 0 Z" fill="#38bdf8" filter="url(#shadow)" />
  </g>

  <!-- Graduation Cap Tassel -->
  <g transform="translate(200, 370)">
    <rect x="-40" y="0" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.2" />
    <text x="60" y="23" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">STUDYSAATHI</text>
  </g>
</svg>
